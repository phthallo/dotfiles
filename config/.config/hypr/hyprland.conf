#####################
### LOOK AND FEEL ###
#####################

# Refer to https://wiki.hypr.land/Configuring/Variables/

# https://wiki.hypr.land/Configuring/Variables/#general
general {
    gaps_in = 5
    gaps_out = 20

    border_size = 2

    # https://wiki.hypr.land/Configuring/Variables/#variable-types for info about colors
    # Border colours now come from the theme, sourced at the bottom of this file
    # so it wins over anything set here. Everything else in this block stays
    # hand-tuned - all ten themes ship identical geometry, so there is nothing
    # to gain from letting the theme own gaps, rounding or opacity.
    # col.active_border = rgba(98971aee) rgba(d79921ee) 45deg
    # col.inactive_border = rgba(928374aa)

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = true

    # Please see https://wiki.hypr.land/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    layout = dwindle
}

# https://wiki.hypr.land/Configuring/Variables/#decoration
decoration {
    rounding = 10
    rounding_power = 2

    # Change transparency of focused and unfocused windows
    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    # https://wiki.hypr.land/Configuring/Variables/#blur
    blur {
        enabled = true
        size = 3
        passes = 1

        # Hyprspace's draw() sets m_blurFBShouldRender at RENDER_POST_WINDOWS, after
        # Hyprland's pre-blur step. With the optimized blur FB on, that regenerates it
        # mid-frame and the screen ends up showing the FB's background-only contents:
        # wallpaper everywhere except the overview panel strip. Off until the plugin
        # stops touching that flag (see Render.cpp:176).
        new_optimizations = false

        vibrancy = 0.1696
    }
}

# https://wiki.hypr.land/Configuring/Variables/#animations
animations {
    enabled = yes, please :)

    # Default animations, see https://wiki.hypr.land/Configuring/Animations/ for more

    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = easeInOutCubic,0.65,0.05,0.36,1
    bezier = linear,0,0,1,1
    bezier = almostLinear,0.5,0.5,0.75,1.0
    bezier = quick,0.15,0,0.1,1

    animation = global, 1, 10, default
    animation = border, 1, 5.39, easeOutQuint
    animation = windows, 1, 4.79, easeOutQuint
    animation = windowsIn, 1, 4.1, easeOutQuint, popin 87%
    animation = windowsOut, 1, 1.49, linear, popin 87%
    animation = fadeIn, 1, 1.73, almostLinear
    animation = fadeOut, 1, 1.46, almostLinear
    animation = fade, 1, 3.03, quick
    animation = layers, 1, 3.81, easeOutQuint
    animation = layersIn, 1, 4, easeOutQuint, fade
    animation = layersOut, 1, 1.5, linear, fade
    animation = fadeLayersIn, 1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.39, almostLinear
    animation = workspaces, 1, 1.94, almostLinear, slide
    animation = workspacesIn, 1, 1.21, almostLinear, slide
    animation = workspacesOut, 1, 1.94, almostLinear, slide
}

# Ref https://wiki.hypr.land/Configuring/Workspace-Rules/
# "Smart gaps" / "No gaps when only"
# uncomment all if you wish to use that.
# workspace = w[tv1], gapsout:0, gapsin:0
# workspace = f[1], gapsout:0, gapsin:0
# windowrule = bordersize 0, floating:0, onworkspace:w[tv1]
# windowrule = rounding 0, floating:0, onworkspace:w[tv1]
# windowrule = bordersize 0, floating:0, onworkspace:f[1]
# windowrule = rounding 0, floating:0, onworkspace:f[1]

# See https://wiki.hypr.land/Configuring/Dwindle-Layout/ for more
dwindle {
    preserve_split = true # You probably want this
}

# See https://wiki.hypr.land/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# https://wiki.hypr.land/Configuring/Variables/#misc
misc {
    force_default_wallpaper = 0 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = true # If true disables the random hyprland logo / anime girl background. :(
}

# Fix blurry XWayland apps under fractional scaling
xwayland {
    force_zero_scaling = true
}


#############
### INPUT ###
#############

# https://wiki.hypr.land/Configuring/Variables/#input
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = false
    }
}

# https://wiki.hypr.land/Configuring/Variables/#gestures
# gestures {
#    workspace_swipe = true
#    workspace_swipe_fingers = 3
#    workspace_swipe_invert = false
#    workspace_swipe_create_new = true
#    workspace_swipe_distance = 700
#}

gestures {
	workspace_swipe_invert = false
	workspace_swipe_distance = 900
	gesture = 3, horizontal, workspace
}
# Example per-device config
# See https://wiki.hypr.land/Configuring/Keywords/#per-device-input-configs for more
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}


###################
### KEYBINDINGS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/
$mainMod = ALT_L

# Example binds, see https://wiki.hypr.land/Configuring/Binds/ for more
bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod, B, exec, firefox 
bind = $mainMod, M, exec, flatpak run --socket=wayland com.spotify.Client
bind = $mainMod, Space, exec, vicinae toggle
bind = $mainMod, Q, killactive,
bind = $mainMod, X, exit,
bind = $mainMod, F, exec, $fileManager
bind = $mainMod, V, togglefloating,
bind = $mainMod, R, exec, $menu
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, J, layoutmsg, togglesplit # dwindle
bind = $mainMod SHIFT, S, exec, sh -c 'exec ~/.local/bin/screenshot region'
bind = $mainMod, L, exec, hyprlock -q > /dev/null 2>&1

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Switch workspaces with mainMod + [0-9]
# Keep workspaces 1-5 always present (the bar + hyprspace show them even when empty)
workspace = 1, persistent:true
workspace = 2, persistent:true
workspace = 3, persistent:true
workspace = 4, persistent:true
workspace = 5, persistent:true

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Vicinae blur
layerrule {
    name = vicinae_blur
    match {
        namespace = vicinae
    }
    blur = true
    ignore_alpha = 0
}

# disable fade animation for vicinae only
layerrule {
    name = vicinae_noanim
    match {
        namespace = vicinae
    }
    no_anim = true
}

# Quickshell's control centre and its click-outside backdrop close on the
# same frame the click lands - layersOut/fadeLayersOut otherwise stretch
# that shut over ~150ms, which reads as lag.
layerrule {
    name = quickshell_cc_noanim
    match {
        namespace = quickshell:controlcenter
    }
    no_anim = true
}
layerrule {
    name = quickshell_cc_backdrop_noanim
    match {
        namespace = quickshell:cc-backdrop
    }
    no_anim = true
}

# Example special workspace (scratchpad)
bind = $mainMod, TAB, overview:toggle
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod CTRL, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move windows in workspace  with mainMod + shift
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, moveWindow, d

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
# bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
# bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
# bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
# bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
# bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
# bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# Prefer Avizo controls
# Volume
bindel = ,XF86AudioRaiseVolume, exec, volumectl -u up
bindel  = ,XF86AudioLowerVolume, exec, volumectl -u down
bindel = ,XF86AudioMute, exec, volumectl toggle-mute
bindel = ,XF86AudioMicMute, exec, volumectl -m toggle-mute

# Brightness
bindel = ,XF86MonBrightnessUp, exec, lightctl up
bindel = ,XF86MonBrightnessDown, exec, lightctl down

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hypr.land/Configuring/Window-Rules/ for more
# See https://wiki.hypr.land/Configuring/Workspace-Rules/ for workspace rules

# Example windowrule
# windowrule = float,class:^(kitty)$,title:^(kitty)$

# terminal opacity
windowrule {
    name = kitty_opacity
    match {
        class = ^(kitty)$
    }
    opacity = 0.9
}

# vscode opacity
windowrule {
    name = code_opacity
    match {
        class = ^(code)$
    }
    opacity = 0.9
}

# stop massive file upload windows
windowrule {
    name = file_upload_size
    match {
        title = File Upload
    }
    size = 840 640
    center = true
}

# Ignore maximize requests from apps. You'll probably like this.
windowrule {
    name = ignore_maximize
    match {
        class = .*
    }
    suppress_event = maximize
}

# Fix some dragging issues with XWayland
windowrule {
    name = xwayland_drag_fix
    match {
        class = ^$
        title = ^$
        xwayland = true
        float = true
        fullscreen = false
        pin = false
    }
    no_focus = true
}

# Portal file dialogs (zenity, GTK save/open pickers) arrive with no parent
# window, so Hyprland tiles them into the layout instead of floating them.
windowrule {
    name = portal_dialog_float
    match {
        class = ^(xdg-desktop-portal-gtk)$
    }
    float = true
    size = 1000 700
    center = true
}

# Super+V floats a tiled window at its tile geometry, which can exceed
# monitor bounds under fractional scaling. Clamp and recenter it.
windowrule {
    name = float_toggle_size_clamp
    match {
        float = true
    }
    max_size = 1628 1041
    center = true
}

# picture in picture videos - defined after float_toggle_size_clamp so its
# move wins over that rule's center (last matching rule wins per field).
windowrule {
   name = picture_in_picture
   match {
       title = ^Picture-in-Picture$
   }
   float = true
   pin = true
   size = 509 339
   move = 1163 70
}

# Fix Zoom video conferencing app being completely borked
windowrule {
    name = zoom_menu_fix
    match {
        class = zoom
        title = menu window
    }
    move = min(cursor_x,monitor_w-window_w) min(cursor_y,monitor_h-window_h)
}

# --- theme-switcher ---
# Regenerated by ~/.config/theme-switcher/apply-theme.sh on every theme switch.
# Sourced last so its border colours override the general{} block above.
source = ~/.config/hypr/generated-theme.conf
